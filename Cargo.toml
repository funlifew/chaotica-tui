[package]
name = "chaotica-tui"
version = "0.1.0"
edition = "2024"
description = "An interactive chaos theory simulator for the terminal"
repository = "https://github.com/funlifew/chaotica-tui"
license = "MIT"
keywords = ["chaos", "physics", "simulation", "tui"]
categories = ["science", "visualization", "command-line-utilities"]

[dependencies]
ratatui = "0.29.0"
crossterm = "0.28.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1